name: Keyword discovery (one-off)

# Manual only — this is an analysis run, not part of the hourly pipeline.
# It relevance-tests candidate keywords harvested from Apple's autocomplete.
on:
  workflow_dispatch:

permissions:
  contents: read

# Deliberately NOT the ratings-data group: this job never pushes, so it cannot
# race the collectors, and sharing their group would make it queue behind (or
# delay) real data collection.
concurrency:
  group: kw-discovery
  cancel-in-progress: false

jobs:
  # Same reasoning as the keyword collector: Apple throttles /search per IP and
  # runner IPs are a lottery, so keep each runner's call count low. 327
  # candidates split nine ways is ~35-40 calls per runner, spaced ~1s apart.
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { market: fr, chunk: 0, chunks: 4 }
          - { market: fr, chunk: 1, chunks: 4 }
          - { market: fr, chunk: 2, chunks: 4 }
          - { market: fr, chunk: 3, chunks: 4 }
          - { market: es, chunk: 0, chunks: 3 }
          - { market: es, chunk: 1, chunks: 3 }
          - { market: es, chunk: 2, chunks: 3 }
          - { market: mx, chunk: 0, chunks: 2 }
          - { market: mx, chunk: 1, chunks: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe ${{ matrix.market }} chunk ${{ matrix.chunk }}
        run: node scripts/kw-discover.mjs ${{ matrix.market }} ${{ matrix.chunk }} ${{ matrix.chunks }}
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.market }}-${{ matrix.chunk }}
          path: discovery/*.json

  # Results come back as one artifact to download; nothing is committed, so the
  # hourly bot's history stays clean.
  collect:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: discovery-*
          merge-multiple: true
          path: discovery
      - name: Summarise
        run: |
          echo "files: $(ls discovery | wc -l)"
          node -e '
            const fs=require("fs");
            const rows=fs.readdirSync("discovery").flatMap(f=>JSON.parse(fs.readFileSync("discovery/"+f)));
            console.log("validated terms:", rows.length);
            console.log("category-relevant (3+ known apps in top 10):", rows.filter(r=>r.known>=3).length);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: kw-discovery-results
          path: discovery/*.json
