name: Keyword discovery (one-off)

# Manual only — this is an analysis run, not part of the hourly pipeline.
# It relevance-tests candidate keywords harvested from Apple's autocomplete.
on:
  workflow_dispatch:

permissions:
  contents: read

# Deliberately NOT the ratings-data group: this job never pushes, so it cannot
# race the collectors, and sharing their group would make it queue behind (or
# delay) real data collection.
concurrency:
  group: kw-discovery
  cancel-in-progress: false

jobs:
  # The matrix is derived from scripts/kw-candidates.json rather than hardcoded,
  # so a new discovery batch only means replacing that file — no workflow edit.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        # Same reasoning as the keyword collector: Apple throttles /search per
        # IP and runner IPs are a lottery, so cap each runner near 40 calls.
        run: |
          node -e '
            const c = require("./scripts/kw-candidates.json");
            const PER = 40, include = [];
            for (const [market, rows] of Object.entries(c)) {
              const chunks = Math.max(1, Math.ceil(rows.length / PER));
              for (let chunk = 0; chunk < chunks; chunk++) include.push({ market, chunk, chunks });
            }
            console.log("matrix=" + JSON.stringify({ include }));
          ' >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.gen.outputs.matrix }}"

  probe:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe ${{ matrix.market }} chunk ${{ matrix.chunk }}
        run: node scripts/kw-discover.mjs ${{ matrix.market }} ${{ matrix.chunk }} ${{ matrix.chunks }}
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.market }}-${{ matrix.chunk }}
          path: discovery/*.json

  # Results come back as one artifact to download; nothing is committed, so the
  # hourly bot's history stays clean.
  collect:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: discovery-*
          merge-multiple: true
          path: discovery
      - name: Summarise
        run: |
          echo "files: $(ls discovery | wc -l)"
          node -e '
            const fs=require("fs");
            const rows=fs.readdirSync("discovery").flatMap(f=>JSON.parse(fs.readFileSync("discovery/"+f)));
            console.log("validated terms:", rows.length);
            console.log("category-relevant (3+ known apps in top 10):", rows.filter(r=>r.known>=3).length);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: kw-discovery-results
          path: discovery/*.json
