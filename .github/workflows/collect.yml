name: Collect ratings

on:
  schedule:
    # Best-effort: GitHub fires this when it pleases.
    - cron: "9 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Failures raise an issue: a scheduled workflow's failure mail is easy to
  # filter away, and an issue is visible on the repo itself.
  issues: write

concurrency:
  group: ratings-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch ratings
        run: node scripts/collect.mjs

      # Never fails the job: the script exits 0 on any error (including the
      # secret not being set), so ratings collection can't be taken down by
      # the pageview ride-along.
      - name: Fetch website pageviews
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/pageviews.mjs

      # Pulls new daily instances from App Store Connect. The script exits 0
      # when the secrets are absent, so a fork or a repo that has never set
      # them up still collects ratings -- the `secrets` context cannot be read
      # from a step `if`, so the check has to live in the script. The key is the read-only
      # reporting one: it can read every analytics report and nothing else,
      # which is the difference between a leaked secret costing you a data
      # feed and costing you the account.
      - name: Ingest App Store Connect analytics
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/asc-reports.mjs

      # Rolls the shards the step above just refreshed into the per-country
      # totals the ratings table shows. Reads only the repo, so it needs no
      # credential and still runs when the ingest above skipped -- it just
      # re-sums whatever the shards already held.
      - name: Roll up downloads
        run: node scripts/downloads.mjs

      - name: Commit data
        run: |
          git config user.name "ratings-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: $(date -u '+%F %H:%M')"
            git pull --rebase
            git push
          fi

      - name: Raise an issue on failure
        if: failure()
        uses: ./.github/actions/alert
        with:
          token: ${{ github.token }}
          title: "Ratings collector is failing"
          body: |
            `collect.mjs` exited non-zero, which it only does when more than a
            quarter of storefronts failed to answer. Ratings on the dashboard
            are being carried forward, not updated.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
