name: Collect ratings

on:
  schedule:
    # Best-effort: GitHub fires this when it pleases.
    - cron: "9 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratings-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch ratings
        run: node scripts/collect.mjs

      # Single-commit history: new data is amended into the one "v1.0" commit.
      - name: Amend data into the single commit
        run: |
          git config user.name "ratings-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit --amend --no-edit
            git push --force-with-lease
          fi
