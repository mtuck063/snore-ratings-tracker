name: Collect ratings

on:
  schedule:
    # Best-effort: GitHub fires this when it pleases.
    - cron: "9 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratings-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch ratings
        run: node scripts/collect.mjs

      # Normal commits: force-pushed history stalls GitHub's cron scheduler.
      - name: Commit data
        run: |
          git config user.name "ratings-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: $(date -u '+%F %H:%M')"
            git pull --rebase
            git push
          fi
