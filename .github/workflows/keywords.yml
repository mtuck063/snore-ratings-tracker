name: Track keywords

on:
  schedule:
    # Four samples a day: single runs jitter a few positions, so the daily
    # history row keeps a running average and min-max range instead.
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Same group as the ratings collector so the two never push over each other.
concurrency:
  group: ratings-data
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Track keywords
        run: node scripts/keywords.mjs

      - name: Commit data
        run: |
          git config user.name "ratings-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data scripts/keywords.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "keywords: $(date -u '+%F')"
            git pull --rebase
            git push
          fi
