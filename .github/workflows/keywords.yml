name: Track keywords

on:
  schedule:
    # Four samples a day: single runs jitter a few positions, so the daily
    # history row keeps a running average and min-max range instead.
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Requeue counter; runs never requeue past attempt 2"
        default: "1"

permissions:
  contents: write
  actions: write

# Same group as the ratings collector so the two never push over each other.
concurrency:
  group: ratings-data
  cancel-in-progress: false

jobs:
  # One job per market: Apple throttles the search API per IP and runner IPs
  # are a lottery, so each market gets its own runner making only ~20-60
  # search calls. Keep the list in sync with markets in scripts/keywords.json.
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        market: [us, ca, gb, au, fr, es, mx]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect ${{ matrix.market }}
        run: node scripts/keywords.mjs --collect ${{ matrix.market }}

      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.market }}
          path: partials/${{ matrix.market }}.json

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          merge-multiple: true
          path: partials

      - name: Merge partials
        run: |
          set -o pipefail
          node scripts/keywords.mjs --merge 2>&1 | tee run.log

      - name: Commit data
        run: |
          git config user.name "ratings-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data scripts/keywords.json scripts/hints.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "keywords: $(date -u '+%F')"
            git pull --rebase
            git push
          fi

      # Some runner IPs are throttled or blocked by Apple; carried-over values
      # keep the data sane, but a fresh runner usually draws a clean IP. One
      # requeue max, guarded by the attempt input.
      - name: Requeue on bad runner IPs
        if: github.event.inputs.attempt == '' || github.event.inputs.attempt == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fails=$(grep -o "RANK_FAILURES=[0-9]*" run.log | cut -d= -f2)
          echo "rank failures this run: ${fails:-unknown}"
          if [ -n "$fails" ] && [ "$fails" -gt 40 ]; then
            echo "requeueing once for fresh runners"
            gh workflow run keywords.yml -f attempt=2 --repo ${{ github.repository }}
          fi
