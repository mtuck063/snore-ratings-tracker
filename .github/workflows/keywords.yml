name: Track keywords

on:
  schedule:
    # Four samples a day: single runs jitter a few positions, so the daily
    # history row keeps a running average and min-max range instead.
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Requeue counter; runs never requeue past attempt 2"
        default: "1"

permissions:
  contents: write
  actions: write
  issues: write

# Same group as the ratings collector so the two never push over each other.
concurrency:
  group: ratings-data
  cancel-in-progress: false

jobs:
  # The job list is derived from scripts/keywords.json rather than written out
  # here, because auto-discovery keeps adding keywords: a market that grows
  # past the per-runner budget splits across runners on its own, with no edit
  # to this file. Same reasoning as the discovery workflow's setup job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: gen
        run: echo "matrix=$(node scripts/keywords.mjs --matrix)" >> "$GITHUB_OUTPUT"

      - run: echo "${{ steps.gen.outputs.matrix }}"

  # One job per market, or per shard of a market: Apple throttles the search
  # API per IP and runner IPs are a lottery, so no single runner is allowed to
  # make more than SHARD_MAX search calls. An 81-keyword US leg on one runner
  # is what lost two ranks to HTTP 403.
  collect:
    needs: plan
    # Named, because a generated matrix would otherwise label the job with
    # every value in the entry: "collect (us, 1/2, us-1)".
    name: collect ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect ${{ matrix.id }}
        run: node scripts/keywords.mjs --collect ${{ matrix.market }} ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.id }}
          path: partials/${{ matrix.id }}.json

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          merge-multiple: true
          path: partials

      - name: Merge partials
        run: |
          set -o pipefail
          node scripts/keywords.mjs --merge 2>&1 | tee run.log

      # Prioritisation runs on the merged data, and re-reads the live title and
      # subtitle so coverage is graded against what the listing says today
      # rather than what it said when someone last wrote it down. Never fails
      # the run: a page that 429s keeps the stored listing, and stale metadata
      # is worth far less than a lost keyword merge.
      - name: Score and group keywords
        continue-on-error: true
        run: node scripts/aso.mjs --fetch

      - name: Commit data
        run: |
          git config user.name "ratings-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data scripts/keywords.json scripts/hints.json scripts/metadata.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "keywords: $(date -u '+%F')"
            git pull --rebase
            git push
          fi

      # Some runner IPs are throttled or blocked by Apple; carried-over values
      # keep the data sane, but a fresh runner usually draws a clean IP. One
      # requeue max, guarded by the attempt input.
      # The threshold tracks SHARD_MAX: a wholly blocked runner now costs at
      # most one shard, so the old 40 (set when a market leg was up to 81
      # keywords) would have let a dead shard through unnoticed.
      - name: Requeue on bad runner IPs
        if: github.event.inputs.attempt == '' || github.event.inputs.attempt == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fails=$(grep -o "RANK_FAILURES=[0-9]*" run.log | cut -d= -f2)
          echo "rank failures this run: ${fails:-unknown}"
          if [ -n "$fails" ] && [ "$fails" -gt 20 ]; then
            echo "requeueing once for fresh runners"
            gh workflow run keywords.yml -f attempt=2 --repo ${{ github.repository }}
          fi

      # The requeue above absorbs a single bad runner IP. If the retry is still
      # failing this is not the IP, and carrying values forward silently would
      # leave stale ranks looking current.
      - name: Fail if the retry is still failing
        if: github.event.inputs.attempt == '2'
        run: |
          fails=$(grep -o "RANK_FAILURES=[0-9]*" run.log | cut -d= -f2)
          echo "rank failures on retry: ${fails:-unknown}"
          if [ -n "$fails" ] && [ "$fails" -gt 20 ]; then
            echo "::error::retry still failing ($fails rank fetches); ranks are carried forward, not updated"
            exit 1
          fi

  # Its own job, not a step on `merge`: a failing market leg has to raise the
  # alarm too, and `merge` runs with if:always() so a step there would never
  # see the matrix failure.
  alert:
    needs: [plan, collect, merge]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/alert
        with:
          token: ${{ github.token }}
          title: "Keyword collector is failing"
          body: |
            A market leg failed, the merge failed, or a requeued run was still
            failing on its second attempt. Ranks on the dashboard are being
            carried forward, not updated.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
